name: Build Android APK

on:
  push:
    branches: [main, fix/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Flutter (direct download)
        run: |
          cd $HOME
          wget -q https://storage.googleapis.com/flutter_infra_release/releases/beta/linux/flutter_linux_3.47.7-beta.tar.xz
          tar xf flutter_linux_3.47.7-beta.tar.xz
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter --version
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release --split-per-abi
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
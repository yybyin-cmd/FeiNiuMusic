name: feiniu_music
description: "飞牛音乐客户端"
publish_to: "none"

version: 1.6.8+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.7.0
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  crypto: ^3.0.6
  signals: ^6.3.0
  signals_flutter: ^6.3.0
  just_audio: ^0.10.5
  audio_session: ^0.2.2
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  permission_handler: ^12.0.1
  photo_manager: ^3.2.0
  flutter_lyric:
    path: plugins/flutter_lyric
  webdav_client: ^1.2.2
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.2
  shelf: ^1.4.1
  qr_flutter: ^4.1.0
  file_picker: ^10.3.10
  image_cropper: ^9.0.0
  audio_service: ^0.18.18
  flutter_local_notifications: ^17.2.2
  lpinyin: ^2.0.3
  flutter_image_compress: ^2.4.0
  audio_metadata_reader: ^1.4.2
  flutter_displaymode: ^0.7.0
  url_launcher: ^6.3.1
  skeletonizer: ^2.1.3
  package_info_plus: ^8.0.2
  shadcn_flutter: ^0.0.53
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^7.3.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.13.0
  sqflite_common_ffi: ^2.4.2
  liquid_glass_widgets: ^0.30.1
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  desktop_multi_window: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  path_provider_platform_interface: ^2.1.2

dependency_overrides:
  skeletonizer: 2.1.3
  liquid_glass_widgets: 0.18.4
  signals: 6.3.0
  signals_flutter: 6.3.0
  just_audio: 0.10.5
  audio_session: 0.2.2
  media_kit: 1.2.6
  media_kit_libs_audio: 1.0.7
  permission_handler: 12.0.1
  photo_manager: 3.2.0
  webdav_client: 1.2.2
  sqflite: 2.4.2
  dio: 5.4.0
  crypto: 3.0.6
  shared_preferences: 2.2.2
  path_provider: 2.1.5
  path_provider_platform_interface: 2.1.2
  shelf: 1.4.1
  qr_flutter: 4.1.0
  file_picker: 10.3.10
  image_cropper: 9.0.0
  audio_service: 0.18.18
  flutter_local_notifications: 17.2.2
  lpinyin: 2.0.3
  flutter_image_compress: 2.4.0
  audio_metadata_reader: 1.4.2
  flutter_displaymode: 0.7.0
  url_launcher: 6.3.1
  package_info_plus: 8.0.2
  shadcn_flutter: 0.0.53
  cached_network_image: 3.4.1
  flutter_cache_manager: 3.4.1
  connectivity_plus: 7.3.1
  webview_flutter: 4.10.0
  webview_flutter_android: 4.10.15
  webview_flutter_platform_interface: 2.14.0
  sqflite_common_ffi: 2.4.2
  tray_manager: 0.5.3
  window_manager: 0.5.2
  desktop_multi_window: 0.3.1
  dynamic_color: 1.7.0
  cupertino_icons: 1.0.8

hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/app_icon.ico
    - assets/preview/style_preview_cover.jpg
    - assets/preview/genre_bg.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256